<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A needlessly dramatic Chuck Norris joke generator, powered by Unholy CSS.">
  <title>Chuck Norris Joke Dispenser</title>
  <link rel="stylesheet" href="unholy-core.css">
  <link rel="stylesheet" href="unholy-utility.css">
  <link rel="stylesheet" href="unholy-animations.css">
  <style>
    :root {
      --poster-yellow: #f7cb46;
      --poster-ink: #130f0d;
    }

    body {
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(218, 54, 51, 0.18), transparent 24rem),
        var(--unholy-background);
    }

    .page-shell {
      min-height: 100vh;
      padding-block: clamp(1rem, 4vw, 3rem);
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-block-end: clamp(1.5rem, 4vw, 3rem);
    }

    .eyebrow {
      margin: 0;
      color: var(--poster-yellow);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
      font-size: 0.78rem;
      opacity: 0.72;
    }

    .status::before {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: #42d392;
      content: "";
      box-shadow: 0 0 0 0.25rem rgba(66, 211, 146, 0.12);
    }

    .joke-card {
      position: relative;
      overflow: hidden;
      padding: clamp(1.5rem, 5vw, 4.5rem);
      border: 1px solid var(--unholy-border);
      border-radius: 1.5rem;
      background: var(--unholy-surface);
      box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.28);
    }

    .joke-card::after {
      position: absolute;
      top: -3.5rem;
      right: -2rem;
      color: rgba(247, 203, 70, 0.07);
      content: "★";
      font-size: clamp(12rem, 32vw, 28rem);
      line-height: 1;
      pointer-events: none;
    }

    .joke-layout {
      position: relative;
      z-index: 1;
      align-items: center;
      margin: 0;
    }

    .copy-panel {
      justify-content: center;
    }

    .kicker {
      display: inline-flex;
      align-self: flex-start;
      margin-block-end: 1.5rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--poster-yellow);
      border-radius: 999px;
      color: var(--poster-yellow);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #joke {
      max-width: 20ch;
      margin-block-end: clamp(1.5rem, 4vw, 2.5rem);
      font-size: clamp(2.1rem, 5vw, 4.9rem);
      letter-spacing: -0.045em;
      line-height: 0.98;
      text-wrap: balance;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    #new-joke {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      min-height: 3.25rem;
      padding-inline: 1.4rem;
      border-radius: 999px;
      font-weight: 700;
    }

    #new-joke:focus-visible {
      outline: 3px solid var(--poster-yellow);
      outline-offset: 4px;
    }

    #new-joke[disabled] {
      cursor: wait;
      opacity: 0.7;
    }

    .shortcut {
      margin: 0;
      font-size: 0.78rem;
      opacity: 0.58;
    }

    .portrait-frame {
      position: relative;
      width: min(100%, 30rem);
      margin-inline: auto;
      padding: 0.6rem;
      border: 1px solid rgba(247, 203, 70, 0.4);
      border-radius: 1.35rem;
      background: linear-gradient(145deg, rgba(247, 203, 70, 0.12), transparent);
      transform: rotate(1.5deg);
    }

    .portrait-frame img {
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 1rem;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.08);
    }

    .portrait-label {
      position: absolute;
      right: -0.75rem;
      bottom: 1.5rem;
      margin: 0;
      padding: 0.55rem 0.8rem;
      border-radius: 0.25rem;
      background: var(--poster-yellow);
      color: var(--poster-ink);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transform: rotate(-3deg);
    }

    .footer-note {
      margin-block-start: 1.25rem;
      text-align: center;
      font-size: 0.76rem;
      opacity: 0.5;
    }

    @media (max-width: 599px) {
      .masthead { align-items: flex-start; }
      .status { display: none; }
      .portrait-frame { margin-block-start: 0.75rem; }
      .joke-card::after { display: none; }
    }
  </style>
</head>
<body>
  <main class="container page-shell">
    <header class="masthead">
      <p class="eyebrow">Unholy experiments / No. 001</p>
      <p class="status">Internet folklore generator</p>
    </header>

    <section class="joke-card anim-fade-in" aria-labelledby="joke">
      <div class="row joke-layout">
        <div class="box-medium copy-panel">
          <span class="kicker">Freshly roundhouse-kicked</span>
          <h1 id="joke" aria-live="polite">Chuck Norris doesn't wait for the joke to load. The joke waits for Chuck Norris.</h1>
          <div class="controls">
            <button id="new-joke" type="button">
              <span aria-hidden="true">↻</span>
              Another one
            </button>
            <p class="shortcut">or press the space bar</p>
          </div>
        </div>

        <div class="box-medium">
          <figure class="portrait-frame shadow shadow-hover">
            <img id="chuck-image" src="images/1.jpg" alt="A portrait of Chuck Norris" width="640" height="800">
            <figcaption class="portrait-label">Allegedly unstoppable</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <p class="footer-note">No roundhouse kicks were harmed in the making of this website.</p>
  </main>

  <script>
    const jokeElement = document.querySelector("#joke");
    const imageElement = document.querySelector("#chuck-image");
    const button = document.querySelector("#new-joke");
    const fallbackJokes = [
      "Chuck Norris can divide by zero.",
      "Chuck Norris counted to infinity. Twice.",
      "Chuck Norris can hear sign language.",
      "When Chuck Norris enters a room, he doesn't turn the lights on. He turns the dark off.",
      "Chuck Norris once won a game of Connect Four in three moves."
    ];
    let lastImage = 1;

    function randomFallback() {
      return fallbackJokes[Math.floor(Math.random() * fallbackJokes.length)];
    }

    function rotateImage() {
      let nextImage = lastImage;
      while (nextImage === lastImage) {
        nextImage = Math.floor(Math.random() * 5) + 1;
      }
      lastImage = nextImage;
      imageElement.src = `images/${nextImage}.jpg`;
    }

    async function getChuck() {
      button.disabled = true;
      button.setAttribute("aria-label", "Loading another joke");
      rotateImage();

      try {
        const response = await fetch("https://api.chucknorris.io/jokes/random");
        if (!response.ok) throw new Error("Joke service unavailable");
        const data = await response.json();
        jokeElement.textContent = data.value;
      } catch (error) {
        jokeElement.textContent = randomFallback();
      } finally {
        button.disabled = false;
        button.setAttribute("aria-label", "Get another Chuck Norris joke");
      }
    }

    button.addEventListener("click", getChuck);
    document.addEventListener("keydown", (event) => {
      const target = event.target;
      if (event.code === "Space" && target === document.body) {
        event.preventDefault();
        getChuck();
      }
    });

    getChuck();
  </script>
</body>
</html>
